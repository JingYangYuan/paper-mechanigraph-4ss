<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#ffffff" />
  
  <!-- Outer Framework Box (Symmetric 40px margin all around) -->
  <rect x="40" y="40" width="820" height="520" rx="8" fill="none" stroke="#000000" stroke-width="1.8" />

  <!-- Tier 1: 目标层 (Top) -->
  <g transform="translate(70, 70)">
    <rect width="760" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 4" />
    <rect width="180" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <text x="90" y="58" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000" text-anchor="middle">目标层</text>
    
    <!-- Sub-cards inside Tier 1 -->
    <rect x="210" y="15" width="250" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="335" y="56" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000" text-anchor="middle">空间格局优化重塑</text>

    <rect x="480" y="15" width="250" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="605" y="56" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000" text-anchor="middle">生态系统韧性提升</text>
  </g>

  <!-- Downward Arrow 1 -->
  <line x1="450" y1="170" x2="450" y2="215" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Tier 2: 机制层 (Middle) -->
  <g transform="translate(70, 225)">
    <rect width="760" height="140" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 4" />
    <rect width="180" height="140" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <text x="90" y="78" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000" text-anchor="middle">机制层</text>
    
    <!-- Sub-cards inside Tier 2 -->
    <rect x="210" y="20" width="165" height="100" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="292" y="58" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000" text-anchor="middle">产权整合</text>
    <text x="292" y="86" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">权属确权流转</text>

    <rect x="390" y="20" width="165" height="100" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="472" y="58" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000" text-anchor="middle">多方协同</text>
    <text x="472" y="86" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">政企社民共治</text>

    <rect x="570" y="20" width="165" height="100" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="652" y="58" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000" text-anchor="middle">价值实现</text>
    <text x="652" y="86" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">生态产品转化</text>
  </g>

  <!-- Downward Arrow 2 -->
  <line x1="450" y1="365" x2="450" y2="410" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Tier 3: 实践层 (Bottom) -->
  <g transform="translate(70, 420)">
    <rect width="760" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 4" />
    <rect width="180" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <text x="90" y="58" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000" text-anchor="middle">实践层</text>
    
    <!-- Sub-cards inside Tier 3 -->
    <rect x="210" y="15" width="250" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="335" y="56" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000" text-anchor="middle">全域土地综合整治试点</text>

    <rect x="480" y="15" width="250" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="605" y="56" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000" text-anchor="middle">生态系统保护修复工程</text>
  </g>
</svg>
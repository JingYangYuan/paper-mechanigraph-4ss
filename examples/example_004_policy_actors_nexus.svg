<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850">
  <defs>
    <!-- Standard Single Arrow Marker at Line End Only -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="850" fill="#ffffff" />

  <!-- Outer Frame (Symmetric 40px margin all around: Left 40, Right 40, Top 40, Bottom 40) -->
  <rect x="40" y="40" width="820" height="770" rx="8" fill="none" stroke="#000000" stroke-width="1.8" />

  <!-- 1. Top Node: 议题网络 (投资方、媒体、行业组织) -->
  <g transform="translate(350, 65)">
    <rect width="200" height="95" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="100" y="38" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000" text-anchor="middle">议题网络</text>
    <text x="100" y="66" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">投资方、媒体</text>
    <text x="100" y="84" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">行业组织</text>
  </g>

  <!-- 2. Left Node: 生产者网络 (高校、科研院所) -->
  <g transform="translate(65, 220)">
    <rect width="200" height="95" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="100" y="40" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000" text-anchor="middle">生产者网络</text>
    <text x="100" y="68" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">高校、科研院所</text>
  </g>

  <!-- 3. Right Node: 需求方 (创新型企业) -->
  <g transform="translate(635, 220)">
    <rect width="200" height="95" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="100" y="40" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000" text-anchor="middle">需求方</text>
    <text x="100" y="68" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">创新型企业</text>
  </g>

  <!-- Horizontal Interaction between Left & Right: Dual Parallel Clean Arrows (No backwards start triangles!) -->
  <!-- Top Arrow (Left to Right: 合作交易) -->
  <line x1="265" y1="250" x2="630" y2="250" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="450" y="240" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">合作交易</text>

  <!-- Bottom Arrow (Right to Left: 利益冲突) -->
  <line x1="635" y1="285" x2="270" y2="285" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="450" y="302" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">利益冲突</text>

  <!-- Top to Center Vertical Flow: 资源 / 扩散 (Dual parallel arrows, clean origins) -->
  <line x1="435" y1="160" x2="435" y2="225" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="420" y="195" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="end">资源</text>
  <line x1="465" y1="160" x2="465" y2="225" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="480" y="195" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">扩散</text>

  <!-- 4. Center Node: 专业网络 (中介机构) - Emphasized by double border -->
  <g transform="translate(340, 360)">
    <rect width="220" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <rect x="4" y="4" width="212" height="92" rx="4" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" />
    <text x="110" y="44" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#000000" text-anchor="middle">专业网络</text>
    <text x="110" y="74" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">中介机构</text>
  </g>

  <!-- Center to Top/Middle: 服务 / 提供 -->
  <line x1="450" y1="360" x2="450" y2="310" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="430" y="338" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="end">服务</text>
  <text x="470" y="338" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">提供</text>

  <!-- Center to Left diagonal connection: 平台支撑 (Horizontal, clean offset) -->
  <line x1="340" y1="400" x2="245" y2="315" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="250" y="380" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">平台支撑</text>

  <!-- Center to Right diagonal connection: 基础保障 (Horizontal, clean offset) -->
  <line x1="560" y1="400" x2="655" y2="315" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="650" y="380" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">基础保障</text>

  <!-- Center to Bottom: 利益互惠 (Dual Parallel Arrows, clean origins) -->
  <line x1="435" y1="460" x2="435" y2="540" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="420" y="505" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="end">利益</text>
  <line x1="465" y1="540" x2="465" y2="460" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="480" y="505" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">互惠</text>

  <!-- 5. Bottom Large Box: 府际网络与政策社群 -->
  <g transform="translate(180, 545)">
    <rect width="540" height="230" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <!-- Sub-tier 1: 府际网络 (地方政府) -->
    <text x="270" y="40" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000" text-anchor="middle">府际网络（地方政府）</text>
    
    <!-- Internal Inter-governmental Flow -->
    <line x1="230" y1="65" x2="230" y2="155" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="215" y="115" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="end">执行反馈</text>

    <line x1="310" y1="155" x2="310" y2="65" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="325" y="115" font-family="'FangSong', 'STFangsong', 'SimSun', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">资源导入</text>

    <!-- Sub-tier 2: 政策社群 (中央政府、部委) -->
    <text x="270" y="195" font-family="'SimHei', 'Heiti SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000" text-anchor="middle">政策社群（中央政府、部委）</text>
  </g>

</svg>

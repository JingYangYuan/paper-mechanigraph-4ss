<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="paper-mechanigraph-4ss">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="progress-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="orb-right" cx="85%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-left" cx="15%" cy="85%" r="42%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="32" fill="url(#orb-right)"/>
  <rect width="1280" height="420" rx="32" fill="url(#orb-left)"/>
  <circle cx="1060" cy="80" r="130" fill="#818cf8" opacity=".12" filter="url(#soft)"/>
  <circle cx="160" cy="360" r="120" fill="#38bdf8" opacity=".14" filter="url(#soft)"/>

  <g stroke="#94a3b8" stroke-opacity=".06" stroke-width="1">
    <path d="M80 0v420M160 0v420M240 0v420M320 0v420M400 0v420M480 0v420M560 0v420M640 0v420M720 0v420M800 0v420M880 0v420M960 0v420M1040 0v420M1120 0v420M1200 0v420"/>
    <path d="M0 70h1280M0 140h1280M0 210h1280M0 280h1280M0 350h1280"/>
  </g>

  <text x="88" y="88" fill="#38bdf8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="4">PAPER MASTER 4SS · MECHANIGRAPH</text>
  <text x="88" y="162" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="800">paper<tspan fill="url(#title-grad)">-mechanigraph-4ss</tspan></text>
  <text x="88" y="214" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">纯矢量学术机制图引擎 · 8大经典拓扑与自检闭环</text>

  <g font-family="ui-sans-serif, system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">
    <rect x="88" y="248" width="112" height="36" rx="18" fill="#082f49" stroke="#0ea5e9" stroke-opacity=".7"/>
    <circle cx="106" cy="266" r="4" fill="#38bdf8"/>
    <text x="118" y="271" fill="#bae6fd">TOPOLOGY</text>

    <rect x="208" y="248" width="102" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-opacity=".7"/>
    <circle cx="226" cy="266" r="4" fill="#818cf8"/>
    <text x="238" y="271" fill="#e0e7ff">VECTOR</text>

    <rect x="318" y="248" width="108" height="36" rx="18" fill="#2e1065" stroke="#a855f7" stroke-opacity=".7"/>
    <circle cx="336" cy="266" r="4" fill="#c084fc"/>
    <text x="348" y="271" fill="#f3e8ff">CHROME</text>

    <rect x="434" y="248" width="118" height="36" rx="18" fill="#022c22" stroke="#10b981" stroke-opacity=".7"/>
    <circle cx="452" cy="266" r="4" fill="#34d399"/>
    <text x="464" y="271" fill="#a7f3d0">CSSCI / SSCI</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="88" y="332" fill="#94a3b8" font-size="14" font-weight="500">实体提取 → 构型匹配 → 纯矢量出图 → 视觉闭环自检</text>
    <rect x="88" y="348" width="536" height="12" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <rect x="88" y="348" width="536" height="12" rx="6" fill="url(#progress-bar)"/>
  </g>

  <!-- Right Code & Stats Card (Standard 4SS System) -->
  <g transform="translate(720 50)">
    <rect width="472" height="320" rx="20" fill="#0b1322" fill-opacity=".96" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="5.5" fill="#ef4444" opacity=".8"/>
    <circle cx="46" cy="26" r="5.5" fill="#eab308" opacity=".8"/>
    <circle cx="64" cy="26" r="5.5" fill="#22c55e" opacity=".8"/>
    <text x="86" y="30" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">paper-mechanigraph-4ss.pipeline</text>
    <rect x="348" y="15" width="106" height="22" rx="11" fill="#064e3b" fill-opacity=".8" stroke="#059669" stroke-opacity=".7"/>
    <circle cx="361" cy="26" r="3.5" fill="#34d399"/>
    <text x="370" y="30" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">STANDALONE</text>
    <line x1="16" y1="48" x2="456" y2="48" stroke="#1e293b" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="78" fill="#38bdf8" font-weight="700">TOPOLOGY</text>
      <text x="108" y="78" fill="#cbd5e1">8大经典拓扑构型 · 因果提取</text>
      <text x="24" y="104" fill="#818cf8" font-weight="700">STYLE</text>
      <text x="108" y="104" fill="#cbd5e1">前置交互 · 用户偏好自决</text>
      <text x="24" y="130" fill="#c084fc" font-weight="700">VECTOR</text>
      <text x="108" y="130" fill="#cbd5e1">纯黑白 · 黑体/仿宋字阶 · 零灰色</text>
      <text x="24" y="156" fill="#34d399" font-weight="700">VERIFY</text>
      <text x="108" y="156" fill="#cbd5e1">无头 Chrome 渲染 · 视觉自检闭环</text>
    </g>

    <g transform="translate(20 180)">
      <rect x="0" y="0" width="136" height="74" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="68" y="36" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">8</text>
      <text x="68" y="58" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12">经典拓扑</text>
      
      <rect x="148" y="0" width="136" height="74" rx="12" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
      <text x="216" y="36" text-anchor="middle" fill="#818cf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">16</text>
      <text x="216" y="58" text-anchor="middle" fill="#c7d2fe" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12">制图红线</text>
      
      <rect x="296" y="0" width="136" height="74" rx="12" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="364" y="36" text-anchor="middle" fill="#c084fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">2</text>
      <text x="364" y="58" text-anchor="middle" fill="#e9d5ff" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12">机制顾问</text>
    </g>

    <g transform="translate(24 292)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">
      <text fill="#64748b" font-weight="500">适配：</text>
      <text x="42" fill="#cbd5e1" font-weight="600">Claude Code · Antigravity · OMP · Codex · ZCode</text>
    </g>
  </g>
</svg>
